name: Validate Manifest

# No `paths:` filter. The filter used to be `paths: ['manifest.json']`, which
# meant the repo accumulated exactly ONE CI run on main in its entire history
# (2026-04-25, commit 220eeac) while main moved twice — cf82bd2 and the #1
# merge 61e35e6 both landed with no validation at all. A filter that skips a
# job also reports nothing, so "no red checks" said nothing about the repo.
#
# The job is three short python3 steps on ubuntu-latest; there is no cost
# argument for filtering it. Every PR is validated, and every commit that
# reaches main is validated, so a green check now means the tree was actually
# checked. `push` is scoped to main only so feature branches are not validated
# twice (once by push, once by pull_request).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate JSON syntax
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Validate manifest schema
        run: |
          python3 << 'EOF'
          import json, sys

          with open('manifest.json') as f:
              manifest = json.load(f)

          # Check top-level fields
          assert 'version' in manifest, "Missing 'version' field"
          assert 'bundles' in manifest, "Missing 'bundles' field"
          assert isinstance(manifest['bundles'], list), "'bundles' must be an array"

          required_fields = ['id', 'name', 'description', 'version', 'author',
                             'tags', 'fileCount', 'totalSizeBytes', 'downloadURL', 'sha256Hash']

          ids_seen = set()
          for i, bundle in enumerate(manifest['bundles']):
              for field in required_fields:
                  assert field in bundle, f"Bundle {i} ('{bundle.get('id', '?')}') missing '{field}'"

              # ID uniqueness
              assert bundle['id'] not in ids_seen, f"Duplicate bundle ID: {bundle['id']}"
              ids_seen.add(bundle['id'])

              # Type checks
              assert isinstance(bundle['tags'], list), f"Bundle '{bundle['id']}': tags must be array"
              assert isinstance(bundle['fileCount'], int), f"Bundle '{bundle['id']}': fileCount must be int"
              assert isinstance(bundle['totalSizeBytes'], int), f"Bundle '{bundle['id']}': totalSizeBytes must be int"
              assert bundle['downloadURL'].startswith('https://'), f"Bundle '{bundle['id']}': downloadURL must be HTTPS"
              assert len(bundle['sha256Hash']) == 64, f"Bundle '{bundle['id']}': sha256Hash must be 64 hex chars"

          print(f"Manifest valid: {len(manifest['bundles'])} bundle(s)")
          EOF

      # This step used to swallow every exception: it printed "FAIL <id>" and
      # then carried on, so the job went green while its own output said the
      # download was broken. The stated reason was that a URL "might be behind
      # auth or rate-limited" — but these URLs are exactly the ones the app
      # fetches unauthenticated (App/Constants+Community.swift), so a URL that
      # needs auth IS the defect, not a false positive. A check that cannot go
      # red is not a check.
      #
      # Caveat for whoever hits the first red: HEAD is not universally served,
      # and some CDNs answer it with 405 where GET would be 200. If that turns
      # out to be a real host rather than a real breakage, retry with GET —
      # do not go back to ignoring the result.
      - name: Check download URLs are reachable
        if: github.event_name == 'pull_request'
        run: |
          python3 << 'EOF'
          import json, sys, urllib.request

          with open('manifest.json') as f:
              manifest = json.load(f)

          failures = []
          for bundle in manifest['bundles']:
              url = bundle['downloadURL']
              try:
                  req = urllib.request.Request(url, method='HEAD')
                  resp = urllib.request.urlopen(req, timeout=10)
                  print(f"  OK  {bundle['id']} -> {resp.status}")
              except Exception as e:
                  print(f"  FAIL {bundle['id']} -> {e}")
                  failures.append(bundle['id'])

          # Every URL is reported before the step exits, so one broken bundle
          # does not hide the state of the others.
          if failures:
              sys.exit(f"{len(failures)} unreachable downloadURL(s): {', '.join(failures)}")

          print(f"All {len(manifest['bundles'])} downloadURL(s) reachable")
          EOF
